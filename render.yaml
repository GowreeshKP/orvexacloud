# Orvexa Cloud — Render blueprint (free compute).
# One web service so we stay within the 750 free instance-hours / month.
# Free instances spin down after 15 minutes idle (0.1 CPU / 512 MB).
# Auto-deploy is OFF. Bind secrets in the Render dashboard, never in git.

previewsEnabled: false

services:
  - type: web
    name: orvexa-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    autoDeploy: false
    # NODE_ENV=production would skip typescript/@types; install them for the compile step only.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: PLATFORM_ROOT_DOMAIN
        value: orvexacloud.in
      - key: PUBLIC_APP_URL
        value: https://orvexa-api.onrender.com
      - key: CORS_ORIGIN
        value: https://orvexa-api.onrender.com,https://admin.orvexacloud.in,https://app.orvexacloud.in
      - key: CORS_ALLOW_VERCEL_PREVIEWS
        value: "false"
      - key: VITE_DEMO_MODE
        value: "false"
      - key: ALLOW_CUSTOM_DATABASES
        value: "false"
      - key: MONGODB_MASTER_URI
        sync: false
      - key: MONGODB_TENANT_BASE_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_KEY
        generateValue: true
      - key: SIGNUP_SIGNING_SECRETS
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
