# Render Blueprint — Express API for Orvexa multi-store
# Dashboard: New → Blueprint → connect GowreeshKP/orvexatech-multi-store
# Custom domain: api.orvexacloud.in (CNAME to the Render hostname in Cloudflare DNS)

services:
  - type: web
    name: orvexa-multi-store-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: PLATFORM_ROOT_DOMAIN
        value: orvexacloud.in
      - key: PUBLIC_APP_URL
        value: https://app.orvexacloud.in
      - key: CORS_ORIGIN
        value: https://app.orvexacloud.in,https://orvexacloud.in,http://localhost:8443,http://localhost:3000
      - key: ACCESS_TOKEN_TTL
        value: 1h
      - key: MONGODB_MASTER_URI
        sync: false
      - key: MONGODB_TENANT_BASE_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ADMIN_BOOTSTRAP_KEY
        sync: false
      - key: SIGNUP_SIGNING_SECRETS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Orvexa Cloud <hello@mail.orvexacloud.in>
      - key: MAIL_REPLY_TO
        value: support@orvexacloud.in
