name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  secret-scan:
    uses: ./.github/workflows/secret-scan.yml

  deploy:
    needs: [check, secret-scan]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL || 'https://orvexa-api-nskw.onrender.com' }}
      PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL || 'https://orvexa-cloud.pages.dev' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '786db6086fad1eb1ce99e87e98947870' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RENDER_PRODUCTION_DEPLOY_HOOK: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build portal
        run: npm ci && npm run build
        env:
          VITE_DEMO_MODE: "false"
          VITE_API_URL: ${{ env.PRODUCTION_API_URL }}
          VITE_API_BASE_URL: ${{ env.PRODUCTION_API_URL }}/api

      - name: Note skipped publish steps
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.RENDER_PRODUCTION_DEPLOY_HOOK == '' }}
        run: |
          echo "Pages deploy runs only when CLOUDFLARE_API_TOKEN is set on the production environment."
          echo "Render deploy runs only when RENDER_PRODUCTION_DEPLOY_HOOK is set."
          echo "Smoke still hits the live Render API and orvexa-cloud.pages.dev."

      - name: Deploy Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name orvexa-cloud --branch main --commit-hash ${{ github.sha }}

      - name: Deploy API on Render
        if: ${{ env.RENDER_PRODUCTION_DEPLOY_HOOK != '' }}
        uses: ./.github/actions/render-release
        with:
          deploy-hook: ${{ env.RENDER_PRODUCTION_DEPLOY_HOOK }}
          api-base: ${{ env.PRODUCTION_API_URL }}
          web-base: ${{ env.PRODUCTION_WEB_URL }}
          sha: ${{ github.sha }}

      - name: Smoke live Pages and API
        if: ${{ env.RENDER_PRODUCTION_DEPLOY_HOOK == '' }}
        env:
          API_BASE: ${{ env.PRODUCTION_API_URL }}
          WEB_BASE: ${{ env.PRODUCTION_WEB_URL }}
        run: node scripts/prod-smoke.mjs
