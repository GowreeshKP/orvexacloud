name: Secret Scan

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  workflow_call:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.3"
  # SHA-256 of gitleaks_8.24.3_linux_x64.tar.gz from the official release checksums.
  # Bumping GITLEAKS_VERSION requires updating this digest from the same release.
  GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum-validated)
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz
          gitleaks version

      - name: Scan git history
        run: gitleaks detect --source . --config .gitleaks.toml --log-opts="--all" --no-banner --redact --verbose
