name: Rollback

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to roll back
        required: true
        type: choice
        options: [staging, production]
      sha:
        description: Known-good git SHA to redeploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    timeout-minutes: 25
    env:
      IS_PROD: ${{ inputs.target == 'production' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Rebuild portals at the known-good SHA
        run: npm ci && npm run build
        env:
          VITE_DEMO_MODE: "false"
          VITE_API_URL: ${{ inputs.target == 'production' && (vars.PRODUCTION_API_URL || 'https://orvexa-api-nskw.onrender.com') || 'https://api.staging.orvexacloud.in' }}

      - name: Redeploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '786db6086fad1eb1ce99e87e98947870' }}
          command: pages deploy dist --project-name ${{ inputs.target == 'production' && 'orvexa-cloud' || 'orvexa-admin-staging' }} --commit-hash ${{ inputs.sha }}

      - name: Redeploy shop router
        if: inputs.target == 'staging'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infra/cloudflare
          command: deploy --env ${{ inputs.target }}

      - name: Redeploy Render (production)
        if: ${{ inputs.target == 'production' && secrets.RENDER_PRODUCTION_DEPLOY_HOOK != '' }}
        uses: ./.github/actions/render-release
        with:
          deploy-hook: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}
          api-base: ${{ vars.PRODUCTION_API_URL || 'https://orvexa-api-nskw.onrender.com' }}
          web-base: ${{ vars.PRODUCTION_WEB_URL || 'https://orvexa-cloud.pages.dev' }}
          sha: ${{ inputs.sha }}

      - name: Redeploy Render (staging)
        if: inputs.target == 'staging'
        uses: ./.github/actions/render-release
        with:
          deploy-hook: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
          api-base: ${{ vars.STAGING_API_URL || 'https://api.staging.orvexacloud.in' }}
          web-base: ${{ vars.STAGING_WEB_URL || 'https://admin.staging.orvexacloud.in' }}
          sha: ${{ inputs.sha }}
